services:

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: bpdb_hr_app
        working_dir: /var/www
        restart: unless-stopped
        volumes:
            - .:/var/www
        command: php-fpm
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - hr

    web:
        image: nginx:alpine
        container_name: bpdb_hr_web
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - hr

    node:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        container_name: bpdb_hr_node
        working_dir: /app
        restart: unless-stopped
        volumes:
            - .:/app
        command: >
            sh -c "
                pnpm install --config.confirmModulesPurge=false &&
                pnpm dev --host 0.0.0.0
            "
        ports:
            - "5174:5173"
        depends_on:
            - app
        networks:
            - hr

    db:
        image: postgres:17
        container_name: bpdb_hr_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: bpdb_hr_recruitment
            POSTGRES_USER: bpdb_hr
            POSTGRES_PASSWORD: bpdb_hr_password
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - hr_dbdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U bpdb_hr -d bpdb_hr_recruitment"
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - hr

    redis:
        image: redis:7-alpine
        container_name: bpdb_hr_redis
        restart: unless-stopped
        ports:
            - "127.0.0.1:6380:6379"
        volumes:
            - hr_redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - hr

networks:
    hr:

volumes:
    hr_dbdata:
    hr_redisdata: